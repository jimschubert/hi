# yaml-language-server: $schema=https://goreleaser.com/static/schema-pro.json
# I keep both goreleaser and goleleaser-pro binaries, e.g:
# ln -sf /opt/homebrew/Caskroom/goreleaser-pro/2.14.3/goreleaser /opt/homebrew/bin/goreleaser-pro
# Useful commands:
#   goreleaser-pro build --clean --snapshot --id hi-darwin-arm64 --single-target
version: 2
before:
  hooks:
    - sh -c 'which buf > /dev/null 2>&1 || go install github.com/bufbuild/buf/cmd/buf@latest'
    - go mod download
    - sh -c 'cd internal/proto && buf generate'
    - go fix ./...

env:
  - CGO_ENABLED=1

builds:
  - id: hi-linux-amd64
    main: ./cmd/hi
    binary: hi
    env:
      - CC=gcc
      - CXX=g++
    ldflags:
      - -s -w
      - -X main.programName={{.ProjectName}}
      - -X main.version={{.Version}}
      - -X main.commit={{.ShortCommit}}
    goos:
      - linux
    goarch:
      - amd64

  - id: hi-linux-arm64
    main: ./cmd/hi
    binary: hi
    env:
      - CC=gcc
      - CXX=g++
    ldflags:
      - -s -w
      - -X main.programName={{.ProjectName}}
      - -X main.version={{.Version}}
      - -X main.commit={{.ShortCommit}}
    goos:
      - linux
    goarch:
      - arm64

  - id: hi-darwin-arm64
    main: ./cmd/hi
    binary: hi
    env:
      - CC=clang
      - CXX=clang++
    ldflags:
      - -s -w
      - -X main.programName={{.ProjectName}}
      - -X main.version={{.Version}}
      - -X main.commit={{.ShortCommit}}
    goos:
      - darwin
    goarch:
      - arm64

archives:
  - formats:
      - tar.gz
    files:
      - LICENSE
      - README.md
sboms:
  - id: archive
    artifacts: archive
checksum:
  name_template: checksums.txt
snapshot:
  version_template: "{{ incpatch .Version }}-next"
changelog:
  sort: asc
  use: github
  filters:
    exclude:
      - '^chore'
      - '^test'
      - '^wip'
docker_digest:
  name_template: "digests.txt"
